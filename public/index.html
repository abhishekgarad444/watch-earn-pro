<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Watch &amp; Earn Pro — Watch Ads. Play Games. Collect Coins. Earn Rewards.</title>
<meta name="description" content="Watch & Earn Pro: watch verified ads, play mini games, collect coins and request real rewards. 2 coins per fully watched, verified ad.">
<meta name="theme-color" content="#2a1052">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Optional: admin can enable Google sign-in by adding
     <meta name="google-client-id" content="..."> here,
     or by returning googleClientId from GET /api/config. -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======= Top bar ======= -->
<header id="topbar">
  <a class="brand" href="#/home" aria-label="Watch and Earn Pro home">
    <span class="coin-logo" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="34" height="34"><circle cx="24" cy="24" r="21" fill="#f5c542" stroke="#ffd700" stroke-width="3"/><text x="24" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a1052">₹</text></svg>
    </span>
    <span class="brand-text">Watch <span class="gold">&amp;</span> Earn <span class="gold">Pro</span></span>
  </a>
  <div class="top-actions">
    <button id="btn-bell" class="icon-btn hidden" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="bell-badge" class="badge hidden">0</span>
    </button>
    <select id="lang-select" aria-label="Language"></select>
    <button id="btn-theme" class="icon-btn" aria-label="Toggle light / dark theme">
      <svg id="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icon-moon" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<!-- ======= Announcement banner ======= -->
<div id="announcement" class="announcement hidden" role="status"></div>

<!-- ======= Main view (SPA renders here) ======= -->
<main id="view" aria-live="polite"></main>

<!-- ======= Bottom navigation ======= -->
<nav id="bottomnav" class="hidden" aria-label="Main">
  <a href="#/home" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span data-i18n="nav_home">Home</span>
  </a>
  <a href="#/ads" data-nav="ads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="nav_ads">Watch Ads</span>
  </a>
  <a href="#/games" data-nav="games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/><path d="M17.3 5H6.7a4.7 4.7 0 0 0-4.6 5.6l1.2 5.6A3 3 0 0 0 7.6 18L9 15.5h5l1.4 2.5a3 3 0 0 0 4.3-1.8l1.2-5.6A4.7 4.7 0 0 0 17.3 5z"/></svg>
    <span data-i18n="nav_games">Games</span>
  </a>
  <a href="#/wallet" data-nav="wallet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
    <span data-i18n="nav_wallet">Wallet</span>
  </a>
  <a href="#/profile" data-nav="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
    <span data-i18n="nav_profile">Profile</span>
  </a>
</nav>

<!-- ======= Ad player modal ======= -->
<div id="ad-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Advertisement player">
  <div class="modal-card ad-card">
    <div class="ad-head">
      <span id="ad-title">Advertisement</span>
      <span id="ad-test-badge" class="chip chip-gold hidden">TEST MODE</span>
      <button id="ad-close" class="icon-btn" aria-label="Close ad">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ad-video-wrap">
      <video id="ad-video" playsinline preload="auto"></video>
      <div id="coin-burst" class="coin-burst hidden" aria-hidden="true"></div>
    </div>
    <div class="progress"><div id="ad-progress"></div></div>
    <p id="ad-status" class="ad-status"></p>
    <button id="ad-claim" class="btn btn-gold btn-big hidden">Claim Coins</button>
  </div>
</div>

<!-- ======= Generic modal (confirm etc.) ======= -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost"></button>
      <button id="modal-ok" class="btn btn-danger"></button>
    </div>
  </div>
</div>

<!-- ======= Toast + spinner ======= -->
<div id="toast" class="toast hidden" role="status"></div>
<div id="spinner" class="spinner-wrap hidden"><div class="spinner"></div></div>

<script src="locales.js"></script>
<script src="games.js" defer></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support optional */ });
  });
}
</script>
</body>
</html>
